name: Build TinderVault IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Release tag (e.g. v1.0-ipa), direct URL, or Gofile folder code'
        required: true
        type: string
      inert:
        description: 'Diagnostic: build an inert dylib (no hooks) to isolate a launch crash'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/master" ]; then
            curl -LO https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz -C $THEOS/sdks/ --strip-components=1
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          brew install ldid
          # Build insert-dylib from source
          if ! command -v insert_dylib &>/dev/null; then
            git clone https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
            cd /tmp/insert_dylib
            xcodebuild -quiet
            cp build/Release/insert_dylib /usr/local/bin/
            chmod +x /usr/local/bin/insert_dylib
          fi

      - name: Build Dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          cd Tweak
          if [ "${{ inputs.inert }}" = "true" ]; then
            echo "=== INERT diagnostic build (no hooks) ==="
            make TV_INERT=1 clean all
          else
            make clean all
          fi
          echo "=== Built files ==="
          find .theos/obj -name "*.dylib" -type f
          DYLIB=$(find .theos/obj -name "*.dylib" -type f | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::Build produced no dylib — compilation failed. Aborting."
            exit 1
          fi
          echo "=== otool -L ==="
          otool -L "$DYLIB"
          # Guard: a CydiaSubstrate dependency makes the dylib fail to load on
          # non-jailbroken (sideloaded) devices — the whole tweak would be dead.
          if otool -L "$DYLIB" | grep -qi "substrate"; then
            echo "::error::Dylib links CydiaSubstrate — it will NOT load on sideloaded devices. Build aborted."
            exit 1
          fi
          echo "OK: substrate-free dylib"

      - name: Download IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_URL="${{ inputs.ipa_url }}"
          if [[ "$IPA_URL" == *gofile.io* ]]; then
            FOLDER_CODE=$(echo "$IPA_URL" | sed 's|.*/d/||' | sed 's|/.*||')
            python3 "$GITHUB_WORKSPACE/Tweak/download_gofile.py" "$FOLDER_CODE"
          elif [[ "$IPA_URL" == *github.com*releases*download* ]]; then
            # GitHub release direct download URL — extract tag and asset name
            REPO=$(echo "$IPA_URL" | sed -E 's|https?://github.com/||; s|/releases/download/.*||')
            TAG=$(echo "$IPA_URL" | sed -E 's|.*/releases/download/||; s|/[^/]*$||')
            ASSET=$(echo "$IPA_URL" | sed -E 's|.*/releases/download/[^/]+/||')
            echo "Downloading from repo=$REPO tag=$TAG asset=$ASSET"
            gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" -O Input.ipa
          elif [[ "$IPA_URL" == http* ]]; then
            echo "Downloading IPA from: $IPA_URL"
            curl -L -o Input.ipa "$IPA_URL" --connect-timeout 30 --max-time 600
          else
            echo "Trying GitHub release tag: $IPA_URL"
            # -O writes the single matching asset straight to Input.ipa (a bare
            # -D . would keep the asset's own name and break the later steps).
            gh release download "$IPA_URL" --pattern "*.ipa" -O Input.ipa 2>/dev/null \
              || curl -L -o Input.ipa "https://github.com/mpoukiarmel21-beep/TinderVault/releases/download/$IPA_URL/com.cardify.tinder_17.30.0_und3fined.ipa" --connect-timeout 30 --max-time 600
          fi
          if [ ! -s Input.ipa ]; then
            echo "::error::Input.ipa missing or empty after download (ipa_url=$IPA_URL)."
            exit 1
          fi
          file Input.ipa
          ls -lh Input.ipa

      - name: Inject & Package IPA
        run: |
          export PATH="$THEOS/bin:$PATH"
          DYLIB=$(find Tweak/.theos/obj -name "*.dylib" -type f | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::No dylib to inject. Aborting."
            exit 1
          fi
          echo "Dylib: $DYLIB"

          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"

          echo "[1/6] Extracting IPA..."
          unzip -q "$GITHUB_WORKSPACE/Input.ipa"

          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"
          APP_NAME=$(basename "$APP" .app)
          BIN="$APP/$APP_NAME"
          if [ ! -f "$BIN" ]; then
            # Fall back to the CFBundleExecutable if the binary name differs.
            BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          fi
          echo "Binary: $BIN"

          echo "[2/6] Stripping app extensions & nested apps (sideload hygiene)..."
          # PlugIns/*.appex and a bundled Watch app each need their own signed
          # app-ID + provisioning profile. On a free 7-day profile they exhaust
          # the 3-app-ID budget, and a single stale/mismatched appex entitlement
          # SIGKILLs the whole host at launch (0xe8008016). None are required for
          # the core app to run, so remove them deterministically here rather
          # than relying on Sideloadly's toggle.
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/com.apple.WatchPlaceholder"
          echo "Top-level app dirs after strip:"; ls -1 "$APP" | head -40

          echo "[3/6] Copying dylib into the bundle (Sideloadly deep-signs it)..."
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/$DYLIB" "$APP/Frameworks/TinderVault.dylib"

          echo "[4/6] Injecting load command..."
          # --strip-codesig removes the LC_CODE_SIGNATURE during insertion,
          # --all-yes suppresses the interactive prompt so CI never hangs.
          insert_dylib --strip-codesig --all-yes --inplace "@executable_path/Frameworks/TinderVault.dylib" "$BIN"
          if ! otool -l "$BIN" | grep -q "TinderVault.dylib"; then
            echo "::error::Load command not present after insert_dylib. Aborting."
            exit 1
          fi

          echo "[5/6] Normalizing the code signature (single clean ad-hoc pass)..."
          # insert_dylib mutated the Mach-O, so the original signature is invalid.
          # Use Apple's own codesign to remove any stale/partial signature the
          # injector may have left (more reliable than its truncation), then apply
          # ONE well-formed ad-hoc signature. Sideloadly re-signs authoritatively
          # at install with the real cert and deep-signs Frameworks/; this pass
          # only guarantees the IPA is structurally valid going in. Sign the dylib
          # first, the main binary last (it now references the signed dylib). We
          # deliberately do NOT ad-hoc re-sign the base app's own Frameworks — they
          # arrive validly signed and Sideloadly handles them.
          codesign --remove-signature "$APP/Frameworks/TinderVault.dylib" 2>/dev/null || true
          codesign --remove-signature "$BIN" 2>/dev/null || true
          codesign --force --sign - "$APP/Frameworks/TinderVault.dylib"
          codesign --force --sign - "$BIN"
          codesign --verify --verbose "$BIN" || { echo "::error::codesign verify failed"; exit 1; }

          echo "[6/6] Creating IPA..."
          zip -r -X -q "$GITHUB_WORKSPACE/TinderVault.ipa" Payload/ -x '*.DS_Store'

          echo "=== Done ==="
          ls -lh "$GITHUB_WORKSPACE/TinderVault.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TinderVault-IPA
          path: TinderVault.ipa
          retention-days: 30

      - name: Upload IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --repo "$REPO" --title "TinderVault Build ${{ github.run_number }}" --notes "Automated build from run ${{ github.run_number }}" || true
          gh release upload "$TAG" TinderVault.ipa --repo "$REPO" --clobber
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/TinderVault.ipa" >> $GITHUB_ENV

      - name: Print Download URL
        run: |
          echo "=============================="
          echo "DOWNLOAD YOUR IPA HERE:"
          echo "$DOWNLOAD_URL"
          echo "=============================="
